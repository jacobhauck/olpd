model:
  encoder_net:
    p: &p 64
    mlp:
      hidden_layers:
        - 80
        - 80
        - 80
    feat_expansion:
      features: 80

  reconstructor_net:
    p: &q 64
    mlp:
      hidden_layers:
        - 80
        - 80
        - 80
    feat_expansion:
      features: 80

  approximator_net:
    d_in: *p
    d_out: *q
