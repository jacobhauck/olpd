model:
  name: DeepONet
  branch_config:
    name: MLPBranchNet
    num_sensors: 512
    num_branches: 64
    mlp_config:
      hidden_layers:
        - 128
        - 128
        - 128
      activation:
        name: GELU
  trunk_config:
    name: MLPTrunkNet
    num_branches: 64
    v_d_in: 1
    v_d_out: 2
    mlp_config:
      hidden_layers:
        - 64
        - 64
        - 64
      activation:
        name: GELU
    feat_expansion:
      name: FourierFeatureExpansion
      origin: [ 0 ]
      scale: [ 1 ]
      mode: random
      features: 128
      learnable: true
  scale: sqrt
  bias: true
